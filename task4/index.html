<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <nav>
    <a href="../task1/index.html">Task 1</a>
    <a href="../task2/index.html">Task 2</a>
    <a href="../exercise1/index.html">Task 3</a>
    <a href="index.html">Task 4</a>

  </nav>

  <h1>Table & Feedback Form</h1>

  <section class="card">
    <h2 id="table-title">Student Grades</h2>
    <table>
      <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Grade</th>
      </tr>
      <tr>
        <td>Bagdaulet</td><td>Web Technologies</td><td>95</td>
      </tr>
      <tr class="highlight-row">
        <td>Daryn</td><td>Operating Systems</td><td>70</td>
      </tr>
      <tr>
        <td>Altair</td><td>Linear Algebra</td><td>25</td>
      </tr>
      <tr>
        <td colspan="2">Average Grade</td><td>63.33</td>
      </tr>
    </table>
  </section>

  <section class="card">
    <h2>Feedback Form</h2>
    <form id="feedback-form">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your email">

      <label for="role">Role</label>
      <select id="role">
        <option>Student</option>
        <option>Teacher</option>
        <option>Other</option>
      </select>

      <label>Was this page useful?</label>
      <div class="radio">
        <label><input type="radio" name="useful"> Yes</label>
        <label><input type="radio" name="useful"> No</label>
      </div>

      <label for="comments">Comments</label>
      <textarea id="comments" rows="4" placeholder="Your feedback"></textarea>
      <button type="submit">Submit</button>
    </form>
  </section>

  <footer>© 2026 Bagdaulet Mirzatayev</footer>
</div>
</body>
</html>
